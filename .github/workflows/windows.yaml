name: Windows

on:
  push:
    branches-ignore: [ '**wasm**', '**android**', '**linux**', '**bsd**', '**haiku**', '**macos**', '**ios**' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: webbrowser=TRACE

jobs:
  build:
    name: Build
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '#build-') || contains(github.event.head_commit.message, '#build-windows') }}
    strategy:
      max-parallel: 1
      matrix:
        rust: [stable, beta]
    continue-on-error: ${{ matrix.rust != 'stable' && matrix.rust != 'beta' }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - name: Install specific rust version
        run: |
          rustup install ${{ matrix.rust }} --profile minimal
          rustup component add --toolchain ${{ matrix.rust }} rustfmt clippy
      - name: Compile
        run: cargo +${{ matrix.rust }} build
      - name: Run Tests
        run: cargo +${{ matrix.rust }} test --all --locked --verbose
      - name: Run Tests (hardened)
        run: cargo +${{ matrix.rust }} test --features hardened --locked --verbose --test test_windows tests::test_hardened_mode
      - name: Check Code Formatting
        if: ${{ matrix.rust == 'stable' || matrix.rust == 'beta' }}
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Lints
        if: ${{ matrix.rust == 'stable' || matrix.rust == 'beta' }}
        run: cargo +${{ matrix.rust }} clippy --all-targets -- -D warnings

  link:
    name: Link (${{ matrix.target }}, Rust ${{ matrix.rust }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            host: x86_64-pc-windows-gnu
            rust: stable
            rustflags: -C linker=rust-lld -C link-self-contained=yes
          - target: i686-pc-windows-gnu
            host: x86_64-pc-windows-gnu
            rust: stable
            rustflags: -C linker=gcc -C link-self-contained=no
          - target: i686-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            rust: stable
            rustflags: ''
          - target: x86_64-pc-windows-gnu
            host: x86_64-pc-windows-gnu
            rust: '1.85.0'
            rustflags: -C linker=rust-lld -C link-self-contained=yes
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - name: Install Rust toolchain and target
        run: rustup toolchain install ${{ matrix.rust }}-${{ matrix.host }} --profile minimal --target ${{ matrix.target }}
      # i686 GNU needs MinGW's compiler/runtime libraries; the self-contained
      # bundled-LLD regression is covered by the x86_64 GNU jobs instead.
      - name: Install 32-bit MinGW
        if: matrix.target == 'i686-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Add 32-bit MinGW to PATH
        if: matrix.target == 'i686-pc-windows-gnu'
        shell: msys2 {0}
        run: cygpath -w /mingw32/bin >> "$GITHUB_PATH"
      # This small downstream crate avoids GUI tests and dev-dependencies.
      # x86_64 GNU jobs must link without an external libshlwapi.a search path.
      - name: Build and run Windows link smoke test
        run: cargo +${{ matrix.rust }}-${{ matrix.host }} run --manifest-path tests/windows-link/Cargo.toml --target ${{ matrix.target }}
